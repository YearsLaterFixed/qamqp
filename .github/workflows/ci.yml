name: QAMQP CI

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  broker-independent:
    name: Parser and flow tests (Qt ${{ matrix.qt }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        qt: ["5.15.2", "6.5.3"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          host: linux
          target: desktop
          cache: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build QAMQP with warnings enabled
        working-directory: src
        run: |
          qmake src.pro
          make -j2

      - name: Run broker-independent tests
        shell: bash
        run: |
          set -euo pipefail
          for test in qamqpparser qamqpflow; do
            test_dir="tests/auto/$test"
            (
              cd "$test_dir"
              qmake "$test.pro"
              make -j2
              executable="$(sed -n 's/^TARGET[[:space:]]*=[[:space:]]*//p' "$test.pro" | head -n 1)"
              "./$executable"
            )
          done
          client_dir=tests/auto/qamqpclient
          (cd "$client_dir" && qmake qamqpclient.pro && make -j2)
          for test in channelMaxNegotiation heartbeatNegotiation frameMaxNegotiation protocolMaximums clientPropertiesMerge writeQueueReservation channelAllocationLimit; do
            (cd "$client_dir" && ./tst_qamqpclient "$test")
          done

  rabbitmq-integration:
    name: RabbitMQ integration (Qt 5.15.2)
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jurplel/install-qt-action@v4
        with:
          version: "5.15.2"
          host: linux
          target: desktop
          cache: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential openssl

      - name: Start RabbitMQ with TLS fixtures
        shell: bash
        run: |
          set -euo pipefail
          certificate_dir="$RUNNER_TEMP/qamqp-certificates"
          bash tests/files/ci/generate-certificates.sh "$certificate_dir"
          echo "QAMQP_TEST_CA_CERT=$certificate_dir/testca/cacert.pem" >> "$GITHUB_ENV"
          docker run --detach --name qamqp-rabbitmq \
            --hostname qamqp-rabbitmq \
            --publish 5672:5672 --publish 5671:5671 \
            --mount "type=bind,src=$GITHUB_WORKSPACE/tests/files/ci/rabbitmq.conf,dst=/etc/rabbitmq/rabbitmq.conf,readonly" \
            --mount "type=bind,src=$certificate_dir,dst=/certs,readonly" \
            --health-cmd 'rabbitmq-diagnostics -q ping' \
            --health-interval 2s --health-timeout 5s --health-retries 60 \
            rabbitmq:3.13-management
          for attempt in {1..60}; do
            state=$(docker inspect --format '{{.State.Health.Status}}' qamqp-rabbitmq)
            if [ "$state" = healthy ]; then
              break
            fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' qamqp-rabbitmq)" = healthy
          printf '#!/usr/bin/env bash\nexec docker exec --user rabbitmq qamqp-rabbitmq rabbitmqctl "$@"\n' \
            > "$RUNNER_TEMP/rabbitmqctl"
          chmod +x "$RUNNER_TEMP/rabbitmqctl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build QAMQP and integration tests
        shell: bash
        run: |
          set -euo pipefail
          cd src
          qmake src.pro
          make -j2
          for test in qamqpclient qamqpexchange qamqpqueue qamqpchannel; do
            test_dir="../tests/auto/$test"
            (
              cd "$test_dir"
              qmake "$test.pro"
              make -j2
            )
          done

      - name: Run RabbitMQ integration suites
        shell: bash
        run: |
          set -euo pipefail
          tests/auto/qamqpclient/tst_qamqpclient -functions > "$RUNNER_TEMP/client-test-functions.txt"
          for test in autoReconnect autoReconnectTimeout sslConnect sslRejectsUntrustedCertificate sslRejectsWrongPeerName; do
            grep -Fx "$test()" "$RUNNER_TEMP/client-test-functions.txt"
          done
          for test in qamqpclient qamqpexchange qamqpqueue qamqpchannel; do
            test_dir="tests/auto/$test"
            executable="$(sed -n 's/^TARGET[[:space:]]*=[[:space:]]*//p' "$test_dir/$test.pro" | head -n 1 | tr -d '[:space:]')"
            (cd "$test_dir" && timeout 25m "./$executable" -o "$RUNNER_TEMP/$test.txt",txt) || {
              cat "$RUNNER_TEMP/$test.txt"
              exit 1
            }
            cat "$RUNNER_TEMP/$test.txt"
          done

      - name: Run 100-cycle multi-channel reconnect soak
        working-directory: tests/auto/qamqpclient
        env:
          QAMQP_SOAK_CYCLES: '100'
        run: |
          ./tst_qamqpclient multiChannelReconnectSoak -o "$RUNNER_TEMP/reconnect-soak.txt",txt
          cat "$RUNNER_TEMP/reconnect-soak.txt"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: broker-validation
          path: |
            ${{ runner.temp }}/qamqp*.txt
            ${{ runner.temp }}/reconnect-soak.txt
          if-no-files-found: warn

      - name: RabbitMQ diagnostics on failure
        if: failure()
        run: docker logs qamqp-rabbitmq
      - name: Stop RabbitMQ
        if: always()
        run: docker rm -f qamqp-rabbitmq || true

  source-packages:
    name: Git-free packages (Qt ${{ matrix.qt }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        qt: ['5.15.2', '6.5.3']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          host: linux
          target: desktop
          cache: true
      - name: Install package tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake binutils
      - name: Build and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar --prefix=qamqp-1.0.0/ HEAD | gzip -n > "$RUNNER_TEMP/qamqp-1.0.0.tar.gz"
          mkdir "$RUNNER_TEMP/extracted"
          tar -xzf "$RUNNER_TEMP/qamqp-1.0.0.tar.gz" -C "$RUNNER_TEMP/extracted"
          bash "$RUNNER_TEMP/extracted/qamqp-1.0.0/tests/files/ci/check-release.sh" \
            "$RUNNER_TEMP/package-check" 2>&1 | tee "$RUNNER_TEMP/package-validation.txt"
          cd "$RUNNER_TEMP"
          sha256sum qamqp-1.0.0.tar.gz package-validation.txt > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: source-package-qt-${{ matrix.qt }}
          path: |
            ${{ runner.temp }}/qamqp-1.0.0.tar.gz
            ${{ runner.temp }}/package-validation.txt
            ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error

  sanitizers:
    name: Parser and flow ASan UBSan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install sanitizer baseline
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake qtbase5-dev
      - name: Run instrumented parser and flow suites
        shell: bash
        run: |
          set -euo pipefail
          bash tests/files/ci/run-sanitizers.sh "$RUNNER_TEMP/sanitizers" 2>&1 | tee "$RUNNER_TEMP/sanitizers.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sanitizer-validation
          path: ${{ runner.temp }}/sanitizers.txt
          if-no-files-found: error
